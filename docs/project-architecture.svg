<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">PDF Chat architecture, ingestion, memory, retrieval, and call trace</title>
  <desc id="desc">Arrow diagram showing frontend requests, PDF ingestion, memory storage, query expansion, hybrid retrieval, reranking, caching, and logging.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panelAlt { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 12; }
      .boxBlue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .boxGreen { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 12; }
      .boxAmber { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 12; }
      .boxViolet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 12; }
      .boxRose { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 12; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .softLine { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 7; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #475569; }
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .section { font: 800 22px Arial, sans-serif; fill: #1e293b; }
      .mono { font: 600 13px Consolas, monospace; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120" />
  <text x="60" y="58" class="title">PDF Chat: data flow, memory, ingestion, retrieval, and call trace</text>
  <text x="60" y="88" class="small">Full-stack RAG app: React frontend, FastAPI backend, Supabase Auth/Storage/Postgres, ChromaDB, E5 embeddings, BM25, RRF, BGE reranking, Opencode LLM.</text>

  <rect x="40" y="120" width="470" height="355" class="panel" rx="18" />
  <text x="60" y="154" class="section">1. Frontend and Auth</text>
  <rect x="70" y="180" width="380" height="58" class="boxBlue" />
  <text x="95" y="214" class="label">React / Vite PDF Chat UI</text>
  <text x="95" y="233" class="tiny">Login, upload, document list, chat, dark mode</text>

  <rect x="70" y="270" width="380" height="58" class="box" />
  <text x="95" y="304" class="label">Supabase Auth session</text>
  <text x="95" y="323" class="tiny">JWT sent as Authorization header</text>

  <rect x="70" y="360" width="380" height="72" class="boxGreen" />
  <text x="95" y="395" class="label">Frontend timing headers</text>
  <text x="95" y="415" class="tiny">X-Client-Request-Id, X-Client-Sent-At-Ms</text>

  <path d="M260 238 L260 270" class="line" />
  <path d="M260 328 L260 360" class="line" />

  <rect x="555" y="120" width="470" height="355" class="panel" rx="18" />
  <text x="575" y="154" class="section">2. PDF Ingestion Pipeline</text>
  <rect x="585" y="180" width="380" height="50" class="boxBlue" />
  <text x="610" y="211" class="label">POST /documents/upload</text>

  <rect x="585" y="255" width="380" height="50" class="box" />
  <text x="610" y="286" class="label">Supabase Storage + documents row</text>

  <rect x="585" y="330" width="380" height="50" class="boxAmber" />
  <text x="610" y="361" class="label">PyMuPDF text extraction + OCR</text>

  <rect x="585" y="405" width="380" height="50" class="boxGreen" />
  <text x="610" y="436" class="label">Chunking -> E5 embeddings -> Chroma</text>

  <path d="M775 230 L775 255" class="line" />
  <path d="M775 305 L775 330" class="line" />
  <path d="M775 380 L775 405" class="line" />

  <rect x="1070" y="120" width="490" height="355" class="panel" rx="18" />
  <text x="1090" y="154" class="section">3. Memory and Persistence</text>
  <rect x="1100" y="180" width="400" height="58" class="boxViolet" />
  <text x="1125" y="214" class="label">chat_sessions + chat_messages</text>
  <text x="1125" y="233" class="tiny">Persistent per user and document in Supabase</text>

  <rect x="1100" y="268" width="400" height="58" class="boxViolet" />
  <text x="1125" y="302" class="label">In-process memory tail</text>
  <text x="1125" y="321" class="tiny">LangChain InMemoryChatMessageHistory</text>

  <rect x="1100" y="356" width="400" height="58" class="boxAmber" />
  <text x="1125" y="390" class="label">Conversation summary memory</text>
  <text x="1125" y="409" class="tiny">Summarizes older turns after threshold</text>

  <path d="M1300 238 L1300 268" class="line" />
  <path d="M1300 326 L1300 356" class="line" />

  <rect x="40" y="520" width="720" height="465" class="panel" rx="18" />
  <text x="60" y="554" class="section">4. Query Call Trace: /chat/query</text>

  <rect x="70" y="590" width="285" height="52" class="boxBlue" />
  <text x="92" y="622" class="label">FastAPI validates request</text>

  <rect x="415" y="590" width="285" height="52" class="box" />
  <text x="437" y="622" class="label">Mode routing</text>
  <text x="437" y="638" class="tiny">summary / normal / analytical</text>
  <path d="M355 616 L415 616" class="line" />

  <rect x="70" y="690" width="285" height="66" class="boxGreen" />
  <text x="92" y="720" class="label">Acronym expansion</text>
  <text x="92" y="738" class="tiny">Glossary + document patterns like NDA</text>

  <rect x="415" y="690" width="285" height="66" class="boxGreen" />
  <text x="437" y="720" class="label">LLM query expansion</text>
  <text x="437" y="738" class="tiny">No facts invented; JSON only</text>

  <path d="M557 642 L557 690" class="line" />
  <path d="M415 723 L355 723" class="line" />

  <rect x="70" y="800" width="285" height="66" class="boxViolet" />
  <text x="92" y="830" class="label">Memory context</text>
  <text x="92" y="848" class="tiny">Last 3 turns for expansion</text>

  <rect x="415" y="800" width="285" height="66" class="boxAmber" />
  <text x="437" y="830" class="label">Semantic retrieval cache</text>
  <text x="437" y="848" class="tiny">Document-scoped in-memory citations</text>

  <path d="M212 756 L212 800" class="line" />
  <path d="M355 833 L415 833" class="line" />

  <rect x="70" y="910" width="285" height="52" class="box" />
  <text x="92" y="942" class="label">Answer generation</text>

  <rect x="415" y="910" width="285" height="52" class="boxRose" />
  <text x="437" y="942" class="label">Save exchange + logs</text>
  <path d="M557 866 L557 910" class="line" />
  <path d="M415 936 L355 936" class="line" />

  <rect x="810" y="520" width="750" height="465" class="panel" rx="18" />
  <text x="830" y="554" class="section">5. Retrieval and Reranking Detail</text>

  <rect x="840" y="590" width="275" height="64" class="boxBlue" />
  <text x="862" y="620" class="label">Dense search</text>
  <text x="862" y="638" class="tiny">dense_query -> E5 -> Chroma top 50</text>

  <rect x="1190" y="590" width="275" height="64" class="boxBlue" />
  <text x="1212" y="620" class="label">BM25 search</text>
  <text x="1212" y="638" class="tiny">bm25_query -> lexical top 50</text>

  <rect x="1015" y="705" width="300" height="64" class="boxGreen" />
  <text x="1037" y="735" class="label">RRF fusion</text>
  <text x="1037" y="753" class="tiny">Merge ranks, dedupe chunk ids</text>

  <path d="M977 654 L1110 705" class="line" />
  <path d="M1327 654 L1220 705" class="line" />

  <rect x="840" y="815" width="275" height="64" class="boxAmber" />
  <text x="862" y="845" class="label">BGE rerank #1</text>
  <text x="862" y="863" class="tiny">contextual_query + candidate text</text>

  <rect x="1190" y="815" width="275" height="64" class="boxAmber" />
  <text x="1212" y="845" class="label">Neighbor expansion</text>
  <text x="1212" y="863" class="tiny">Add adjacent chunk_index +/- 1</text>
  <path d="M1165 769 L977 815" class="line" />
  <path d="M1115 847 L1190 847" class="line" />

  <rect x="1015" y="925" width="300" height="52" class="boxAmber" />
  <text x="1037" y="957" class="label">BGE rerank #2 -> final citations</text>
  <path d="M1327 879 L1210 925" class="line" />

  <rect x="40" y="1020" width="1560" height="72" class="panelAlt" rx="16" />
  <text x="60" y="1048" class="section">Observability</text>
  <text x="245" y="1048" class="small">api_logs: LLM calls, query_expansion, summaries, comparison extraction, answers</text>
  <text x="245" y="1072" class="small">request_logs: request_id, method, path, status, client_to_backend_ms, server_duration_ms</text>
  <path d="M700 962 C840 1010, 960 1010, 1035 977" class="softLine" />
  <path d="M1210 977 C1250 1020, 1310 1035, 1390 1040" class="softLine" />
</svg>
